<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Time</title>
    <style>
        :root {
            --ink: #17202a;
            --muted: #65727d;
            --paper: #f6f3ed;
            --blue: #2364aa;
            --orange: #e77645;
            --line: #d9d3c8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--paper);
            background-image: linear-gradient(135deg, rgba(35, 100, 170, 0.07) 0 1px, transparent 1px 100%), linear-gradient(45deg, rgba(231, 118, 69, 0.05) 0 1px, transparent 1px 100%);
            background-size: 28px 28px;
        }

        .time-panel {
            width: min(680px, 100%);
            padding: clamp(32px, 8vw, 72px);
            text-align: center;
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid var(--line);
            box-shadow: 0 18px 45px rgba(33, 50, 68, 0.12);
        }

        .eyebrow {
            color: var(--orange);
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        h1 {
            margin: 18px 0 12px;
            color: var(--blue);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.3rem, 8vw, 4.8rem);
            line-height: 1;
        }

        #date { margin: 0; color: var(--muted); font-size: 1.1rem; }

        #clock {
            margin: 28px 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 13vw, 7rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.04em;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            color: white;
            background: var(--blue);
            text-decoration: none;
        }

        a:hover, a:focus-visible { background: #164574; }
    </style>
</head>

<body>
    <main class="time-panel">
        <div class="eyebrow">TODAY'S TIME</div>
        <h1>今天的时间</h1>
        <p id="date"></p>
        <div id="clock" aria-live="polite"></div>
        <a href="index.html">返回首页</a>
    </main>

    <script>
        const dateElement = document.querySelector('#date');
        const clockElement = document.querySelector('#clock');

        function updateTime() {
            const now = new Date();
            dateElement.textContent = now.toLocaleDateString('zh-CN', {
                year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
            });
            clockElement.textContent = now.toLocaleTimeString('zh-CN', {
                hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>

</html>
