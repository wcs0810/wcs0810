<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端下导航 - 字体图标版</title>
    <link rel="stylesheet" href="font_5238935_2rlng48ulsj/iconfont.css">
    <style>
        :root {
            --wcs810-primary: #07c160;
            --wcs810-bg: #f7f7f7;
            --wcs810-card: #ffffff;
            --wcs810-text: #1a1a1a;
            --wcs810-text-secondary: #999999;
            --wcs810-border: #e5e5e5;
            --wcs810-badge: #fa5151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--wcs810-bg);
            color: var(--wcs810-text);
            min-height: 100vh;
            padding-bottom: calc(56px + env(safe-area-inset-bottom));
        }

        /* 顶部导航 */
        .wcs810_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--wcs810-card);
            border-bottom: 1px solid var(--wcs810-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wcs810_header-title {
            font-size: 17px;
            font-weight: 600;
        }

        .wcs810_header-back {
            color: var(--wcs810-text);
            text-decoration: none;
            font-size: 15px;
        }

        /* 内容区 */
        .wcs810_content {
            padding: 16px;
        }

        .wcs810_card {
            background: var(--wcs810-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }

        .wcs810_card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .wcs810_card-desc {
            font-size: 14px;
            color: var(--wcs810-text-secondary);
            line-height: 1.6;
        }

        /* 底部导航 */
        .wcs810_tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: var(--wcs810-card);
            border-top: 1px solid var(--wcs810-border);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
        }

        .wcs810_tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0 4px;
            text-decoration: none;
            color: var(--wcs810-text-secondary);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .wcs810_tab-item.wcs810_active {
            color: var(--wcs810-primary);
        }

        .wcs810_tab-icon {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .wcs810_tab-icon .iconfont {
            font-size: 24px;
        }

        .wcs810_tab-label {
            font-size: 10px;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* 数字徽章 */
        .wcs810_badge {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(4px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: var(--wcs810-badge);
            color: #fff;
            font-size: 10px;
            font-weight: 500;
            line-height: 16px;
            text-align: center;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* 红点 */
        .wcs810_dot {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(8px);
            width: 8px;
            height: 8px;
            background: var(--wcs810-badge);
            border-radius: 50%;
        }

        /* 页面说明 */
        .wcs810_demo-section {
            margin-top: 24px;
        }

        .wcs810_demo-title {
            font-size: 14px;
            color: var(--wcs810-text-secondary);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .wcs810_icon-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .wcs810_icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            background: var(--wcs810-card);
            border-radius: 8px;
            min-width: 72px;
        }

        .wcs810_icon-item .iconfont {
            font-size: 28px;
            color: var(--wcs810-text);
            margin-bottom: 6px;
        }

        .wcs810_icon-item span {
            font-size: 11px;
            color: var(--wcs810-text-secondary);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="wcs810_header">
        <a href="index.html" class="wcs810_header-back">
            <span class="iconfont icon-close" style="font-size: 18px;"></span>
        </a>
        <h1 class="wcs810_header-title">字体图标版</h1>
        <div style="width: 40px;"></div>
    </header>

    <!-- 内容区 -->
    <main class="wcs810_content">
        <div class="wcs810_card">
            <h2 class="wcs810_card-title">移动端下导航</h2>
            <p class="wcs810_card-desc">
                本页面演示使用 iconfont 字体图标实现的移动端固定底部导航。
                导航包含 4 个项目，支持数字徽章和红点提示。
                底部导航自适应屏幕宽度，固定在视口底部。
            </p>
        </div>

        <div class="wcs810_card">
            <h2 class="wcs810_card-title">导航项目说明</h2>
            <p class="wcs810_card-desc">
                · 首页：无徽章<br>
                · 消息：数字徽章 3<br>
                · 图片：红点提示<br>
                · 我的：数字徽章 12
            </p>
        </div>

        <!-- 图标展示 -->
        <div class="wcs810_demo-section">
            <h3 class="wcs810_demo-title">可用图标</h3>
            <div class="wcs810_icon-list">
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-browser"></span>
                    <span>browser</span>
                </div>
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-list"></span>
                    <span>list</span>
                </div>
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-message"></span>
                    <span>message</span>
                </div>
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-imgage"></span>
                    <span>imgage</span>
                </div>
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-love"></span>
                    <span>love</span>
                </div>
                <div class="wcs810_icon-item">
                    <span class="iconfont icon-save"></span>
                    <span>save</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="wcs810_tabbar">
        <a href="#" class="wcs810_tab-item wcs810_active">
            <span class="wcs810_tab-icon">
                <span class="iconfont icon-browser"></span>
            </span>
            <span class="wcs810_tab-label">首页</span>
        </a>
        <a href="#" class="wcs810_tab-item">
            <span class="wcs810_tab-icon">
                <span class="iconfont icon-message"></span>
                <span class="wcs810_badge">3</span>
            </span>
            <span class="wcs810_tab-label">消息</span>
        </a>
        <a href="#" class="wcs810_tab-item">
            <span class="wcs810_tab-icon">
                <span class="iconfont icon-imgage"></span>
                <span class="wcs810_dot"></span>
            </span>
            <span class="wcs810_tab-label">图片</span>
        </a>
        <a href="#" class="wcs810_tab-item">
            <span class="wcs810_tab-icon">
                <span class="iconfont icon-love"></span>
                <span class="wcs810_badge">12</span>
            </span>
            <span class="wcs810_tab-label">我的</span>
        </a>
    </nav>
</body>
</html>
