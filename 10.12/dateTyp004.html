<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6fa">
    <title>数七游戏｜1 到 100</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: #20243a;
            background: #f5f6fa;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(111, 92, 237, 0.12), transparent 38%),
                radial-gradient(ellipse at 100% 90%, rgba(255, 143, 105, 0.12), transparent 34%),
                #f5f6fa;
        }

        .game {
            width: min(860px, 100%);
            margin: 0 auto;
            padding: clamp(24px, 5vw, 48px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 24px 70px rgba(41, 43, 77, 0.1);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #705de7;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 4rem);
            letter-spacing: -0.06em;
            line-height: 1.1;
        }

        h1 span { color: #705de7; }

        .intro {
            max-width: 560px;
            margin: 16px 0 0;
            color: #686d82;
            font-size: 1rem;
            line-height: 1.8;
        }

        .rule {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin: 28px 0;
            padding: 16px 18px;
            border: 1px solid #ebe8ff;
            border-radius: 16px;
            background: #f7f5ff;
            color: #514b77;
            line-height: 1.7;
        }

        .rule-icon {
            display: grid;
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            place-items: center;
            border-radius: 10px;
            background: #e9e4ff;
            color: #705de7;
            font-weight: 800;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .count {
            color: #686d82;
            font-size: 0.9rem;
        }

        .count strong {
            color: #20243a;
            font-size: 1.15rem;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid #dedfed;
            border-radius: 12px;
            background: #fff;
            color: #41445a;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(41, 43, 77, 0.1);
        }

        button:focus-visible {
            outline: 3px solid rgba(112, 93, 231, 0.35);
            outline-offset: 2px;
        }

        .primary {
            border-color: #705de7;
            background: #705de7;
            color: white;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 8px;
        }

        .number {
            display: grid;
            min-height: 52px;
            place-items: center;
            border: 1px solid #ececf2;
            border-radius: 13px;
            background: #fff;
            color: #34374e;
            font-size: 1rem;
            font-weight: 700;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .number.skipped {
            border-style: dashed;
            border-color: #dcd9ea;
            background: #f7f7fa;
        }

        .number.answer {
            border-color: #ffd5c8;
            background: #fff1ec;
            color: #d45a38;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 0;
            color: #777b8e;
            font-size: 0.82rem;
        }

        .legend-swatch {
            width: 20px;
            height: 16px;
            border: 1px dashed #dcd9ea;
            border-radius: 5px;
            background: #f7f7fa;
        }

        @media (max-width: 620px) {
            body { padding: 20px 12px; }
            .game { border-radius: 22px; }
            .toolbar { align-items: flex-start; flex-direction: column; }
            .number-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
            .number { min-height: 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="game">
        <p class="eyebrow">NUMBER GAME · 01—100</p>
        <h1>有趣的<span>数七</span></h1>
        <p class="intro">从 1 开始依次往下数，遇到“七”就停一下，看看你能不能快速找出所有要跳过的数字！</p>

        <section class="rule" aria-label="游戏规则">
            <span class="rule-icon" aria-hidden="true">!</span>
            <div><strong>游戏规则</strong><br>范围是 1 到 100。数字中含有“7”，或者是 7 的倍数时，该数字不显示。</div>
        </section>

        <div class="toolbar">
            <div class="count" id="summary" aria-live="polite"></div>
            <div class="buttons">
                <button class="primary" id="refresh" type="button">重新开始</button>
                <button id="toggle" type="button" aria-pressed="false">显示答案</button>
            </div>
        </div>

        <section class="number-grid" id="number-grid" aria-label="1 到 100 数字序列"></section>
        <p class="legend"><span class="legend-swatch" aria-hidden="true"></span>空白格代表这个数字要跳过</p>
    </main>

    <script>
        const grid = document.getElementById("number-grid");
        const summary = document.getElementById("summary");
        const toggle = document.getElementById("toggle");
        const refresh = document.getElementById("refresh");
        let answersVisible = false;

        function renderNumbers() {
            const fragment = document.createDocumentFragment();
            let skippedCount = 0;

            for (let number = 1; number <= 100; number += 1) {
                const shouldSkip = number % 7 === 0 || String(number).includes("7");
                const cell = document.createElement("div");
                cell.className = "number";
                cell.setAttribute("role", "listitem");

                if (shouldSkip) {
                    skippedCount += 1;
                    cell.classList.add("skipped");
                    cell.setAttribute("aria-label", "跳过的数字");
                    if (answersVisible) {
                        cell.textContent = String(number);
                        cell.classList.add("answer");
                    }
                } else {
                    cell.textContent = String(number);
                }

                fragment.appendChild(cell);
            }

            grid.replaceChildren(fragment);
            grid.setAttribute("role", "list");
            summary.innerHTML = `数字范围 <strong>1–100</strong><span aria-hidden="true"> · </span>需跳过 <strong>${skippedCount}</strong> 个`;
        }

        toggle.addEventListener("click", () => {
            answersVisible = !answersVisible;
            toggle.textContent = answersVisible ? "隐藏答案" : "显示答案";
            toggle.setAttribute("aria-pressed", String(answersVisible));
            renderNumbers();
        });

        refresh.addEventListener("click", () => {
            answersVisible = false;
            toggle.textContent = "显示答案";
            toggle.setAttribute("aria-pressed", "false");
            renderNumbers();
        });

        renderNumbers();
    </script>
</body>
</html>
